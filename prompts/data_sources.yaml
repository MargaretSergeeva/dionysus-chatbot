# Data registry — which data exists and which build (bot) can reach it (DC2-142).
# Modules name the data they need in `data:` (or `data: general`).
# A module enters a build only if ALL its data sources list that build in `builds`.
# To give a bot new data (e.g. wine catalog uploaded to Gastbot): move the build from `planned` to `builds`.
#
# Builds: full = our own stack (Dify + Supabase, Plan B)
#         gastbot = partner platform Gastbot (no Supabase access; own RAG over rheingau.com)

supabase_project: uywsaicdejkrozllalez   # "Dionysus Chatbot", eu-west-1

sources:
  rheingau_chunks:
    kind: search
    table: rheingau_rag_chunks_v2
    fields: [chunk_text, section_title, page_id]
    note: what the bot reads — 9,106 text chunks of rheingau.com with embeddings (Cohere embed-multilingual-v3.0), searched by meaning with match_rheingau_chunks. Gastbot has the same site through its own RAG.
    docs: DC2-A-96, DC2-A-102
    builds: [full, gastbot]

  rheingau_pages:
    kind: table
    fields: [title, source_url, category, city, dates, phones, emails, partner_links, prices_raw, amenity flags]
    note: what the bot filters by — one row per page (1,922), metadata only; read through filter_rheingau_pages / match_rheingau_chunks_filtered, joined to chunks by page_id
    docs: DC2-A-102
    builds: [full]

  filter_rheingau_pages:
    kind: function
    fields: [amenity flags (pet_friendly, wifi_available, …), category, city, project_status, expected_completion]
    note: exact filter over rheingau_pages (DC2-131, DC2-132); hybrid = match_rheingau_chunks_filtered (filter pages, then rank chunks by meaning)
    docs: DC2-A-96
    builds: [full]

  wines_enriched:
    kind: view
    fields: [weinname, weinname_normalized, synonyms, erzeuger, erzeuger_ort, rebsorte_normalized, weinart_normalized, qualitaetsstufe, lage_weinberg, jahrgang, praemierung, bewertung, alkohol_pct, restzucker_g_l, saeure_g_l, dryness_de, dryness_en, body_de, body_en, quelle_url]
    note: single source the bot reads for wines = wines + wine_dryness + wine_body (schema/views/wines_enriched.sql); modules use this, not the base tables
    docs: DC2-A-102
    builds: [full]
    planned:
      gastbot: upload to partner platform Gastbot — platform not working yet

  wines:
    kind: table
    fields: [erzeuger, erzeuger_ort, jahrgang, weinname, lage_weinberg, rebsorte_normalized, weinart_normalized, qualitaetsstufe, geschmacksrichtung, praemierung, bewertung, restzucker_g_l, saeure_g_l, alkohol_pct, quelle_url]
    note: wine catalog, 763 wines
    docs: DC2-A-102
    builds: [full]
    planned:
      gastbot: upload to partner platform Gastbot — platform not working yet

  wine_dryness:
    kind: table
    fields: [wein_id, dryness_de, dryness_en, basis]
    docs: DC2-A-138
    builds: [full]
    planned:
      gastbot: together with wines

  wine_body:
    kind: table
    fields: [wein_id, full_bodied, body_de, body_en, basis, status]
    docs: DC2-A-139
    builds: [full]
    planned:
      gastbot: together with wines

  wine_humor:
    kind: table
    fields: [category, text_de, text_en, attribution, source_url, usage_note, verified]
    docs: DC2-A-140
    builds: [full]

  historical_anchors:
    kind: table
    fields: [name, city, category, historical_fact, key_year, related_wine, usage_note, source_page_id, verified]
    note: 10 verified anchors, each linked to a rheingau_pages page
    docs: DC2-A-102
    builds: [full]

  gastbot_variables:
    kind: platform
    fields: [isFirstAssistantTurn, followupQuestion]
    note: variables injected by the Gastbot platform
    docs: DC2-A-84
    builds: [gastbot]
