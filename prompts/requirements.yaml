# Requirements — the machine-readable list behind YouTrack DC2-A-84 (DC2-147).
# Every prompt module lists the IDs it covers in `requirements:`; the gate fails on unknown IDs.
# The status report shows requirement → modules; `prompt: false` = met outside the prompt (no module expected).
#
# Types: BR = business (why the client wants the bot) · FR = functional (what the bot does)
#        CR = compliance (law, GDPR, EU AI Act) · QR = quality (our own standard for good answers)
# Add new requirements here and in DC2-A-84 when they are found.

requirements:
  # ── Business ───────────────────────────────────────────────
  BR-01:
    title: Guests ask in natural language instead of keyword search
    source: DC2-A-1 §2, DC2-A-4
  BR-02:
    title: Promote Rheingau wine by presenting wineries (Weinwerbung)
    source: DC2-A-1 §2
  BR-03:
    title: Client sees what guests ask (question analytics)
    source: DC2-A-1 §2, §9
    prompt: false   # logging tables sessions / messages / matched_documents

  # ── Functional ─────────────────────────────────────────────
  FR-01:
    title: Answers in 6 languages (DE, EN, NL, DA, IT, FR)
    source: DC2-A-1 §3
    note: At least DE, EN, NL, DA, IT, FR — tested. Full build (Dify) answers in any language the guest uses (module 1.4). Gastbot — languages are a platform setting (Reply Translation); more can be selected from its list, but not all; unsupported languages fall back to German. Links always go to German pages (rheingau.com is German-only).
  FR-02:
    title: Informal "du"
    source: DC2-A-1 §3 (client decision 09.09.2026)
  FR-03:
    title: Answers based on the data link to their source (the rheingau.com page, or the wine's source); answers without a source — greeting, clarifying question, "no information" — need no link
    source: DC2-A-1 §3, §11 (data provenance)
    note: Merged with former CR-05 "answers traceable to their source (provenance)" on 28.09.2026 — same rule, same module (now module 5.1).
  FR-04:
    title: "Wine finder: grape, wine type, dryness, award, winery"
    source: DC2-A-1 §3, §6
  FR-05:
    title: Proactive wine follow-ups ("other gold-medal wines?")
    source: DC2-A-1 §3
  FR-06:
    title: No invented facts — no price, wine or place outside the data
    source: DC2-A-1 §1, §9
  FR-08:
    title: Questions with exact constraints (place, date, category, amenities, wine attributes) are answered from structured data — completely and without contradictions; semantic search only adds descriptions
    source: DC2-A-1 §1, §5; DC2-A-96 routing; widened 28.09.2026 (DC2-142)
    note: Mitigates the RAG risk in DC2-A-75 (similar but wrong or incomplete results). Full build only — Gastbot has semantic search only (DC2-148).
  FR-09:
    title: Scope is rheingau.com + provided data only, no live third-party lookups
    source: DC2-A-1 §1, §6 (team decision 24.09.2026, DC2-84)
  FR-10:
    title: No alcohol-free recommendations the data does not contain
    source: DC2-A-1 §1
  FR-11:
    title: Answer tourism questions and recommend activities that fit the guest's request
    source: decision 28.09.2026; DC2-A-146
  FR-12:
    title: Time-sensitive facts (dates, prices, availability) help to find but are never confirmed; guest checks the official page
    source: decision 28.09.2026
  FR-13:
    title: Questions about privacy, legal information, newsletter, partner service, press and jobs are answered from the matching rheingau.com pages, with a link
    source: decision 29.09.2026 (replaces the out-of-scope note in DC2-A-1 §6 and module 2.8 rule 2)
    note: The 12 pages (Datenschutz, Datenschutzerklärung, Impressum, Whistleblowing, 4 partner pages, 2 press pages, newsletter, jobs) are still in rheingau_excluded_registry and must be loaded (text, chunks, embeddings) — see the YouTrack task under DC2-142. Until then the deletion answer in module 3.5 carries the Datenschutz link directly.

  # ── Compliance ─────────────────────────────────────────────
  CR-01:
    title: Do not process user-submitted personal data
    source: DC2-A-1 §3, §11 (DC2-107)
    note: Dionysus is a RAG-based information assistant, not a data controller for registration flows — the same "not a booking agent" logic as module 3.6. Keeping PII entirely out of model input/output avoids creating a GDPR processing obligation the bot isn't built to handle. This guardrail is separate from, and narrower than, the logging transparency and deletion handling (CR-02, module 3.5), which covers Dionysus's own conversation logging. (Moved out of module 3.1 on 28.09.2026.)
  CR-02:
    title: "GDPR: honest about chat logging, no fake deletion"
    source: DC2-A-1 §11 (DC2-100, DC2-101, DC2-109)
    note: Consent to save conversations for service improvement is collected site-level, before the chat widget loads — not by Dionysus in the dialogue; so the bot never asks permission to log. Retention period not yet defined (DC2-100). "Never ask for personal data" moved from module 3.5 to 3.1 on 29.09.2026.
  CR-03:
    title: No special-category (health) data
    source: DC2-A-1 §11
    note: GDPR Art. 9 special-category consent is a much higher legal bar than ordinary processing. A feature that does not need health data avoids engaging with it structurally instead of building a consent flow to justify collecting it. (Rationale moved out of module 3.2 on 28.09.2026.)
  CR-04:
    title: Guests are told they are talking to an AI (EU AI Act Art. 50)
    source: DC2-A-1 §11, DC2-A-106 (DC2-98)
  CR-06:
    title: Consent to save conversations is collected before the chat starts (site-level notice before the widget loads); the bot itself never asks for it
    source: DC2-A-1 §11 (DC2-101)
    prompt: false   # met in the frontend / privacy notice
    note: The bot's answer "yes, saved to improve the service" (module 3.5) is only true once this notice is live (DC2-101). Background in the CR-02 note.

  # ── Quality ────────────────────────────────────────────────
  QR-01:
    title: Answers are concise, readable and well-formatted
    source: decision 28.09.2026
  QR-02:
    title: Complaints are acknowledged calmly and pointed to the documented contact, no promises
    source: decision 28.09.2026
